services:
  backend: 
    build:
      context: ../../
      dockerfile: ./docker/dev/django/Dockerfile
    volumes:
      - ../../backend:/app:z
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    env_file:
      - ../../backend/.envs/.env.dev
    depends_on:
      - postgres
      - mailpit
    networks:
      - bloggyspace_nw
  
  postgres:
    build:
      context: ../../
      dockerfile: ./docker/dev/postgres/Dockerfile
    ports:
     - "5432:5432"
    volumes:
      - bloggyspace_dev_db:/var/lib/postgresql/data
    env_file:
      - ../../backend/.envs/.env.dev
    networks:
      - bloggyspace_nw
    
  mailpit:
    image: axllent/mailpit:v1.29
    volumes:
      - bloggyspace_mailpit_db:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - bloggyspace_nw

  nginx:
    build:
      context: ../../
      dockerfile: ./docker/dev/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1/
        VITE_SERVER_URL: http://localhost:8000
        VITE_CLIENT_URL: http://localhost
        VITE_PAYPAL_CLIENT_ID: test
        VITE_CURRENCY_SIGN: $
    ports:
      - "80:80"
    volumes:
      - ../../backend/staticfiles:/app/staticfiles:ro
      - ../../backend/media:/app/media:ro
    depends_on:
      - backend
    networks:
      - bloggyspace_nw

networks:
  bloggyspace_nw:
    external: true

volumes:
  bloggyspace_dev_db:
  bloggyspace_mailpit_db:

      