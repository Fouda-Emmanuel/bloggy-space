services:
  monitoring-nginx:
    build:
      context: ../../
      dockerfile: ./docker/dev/monitoring/nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - prometheus
      - grafana
      - portainer
    networks:
      - monitoring_dev_nw
      - bloggyspace_nw
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
        - ../../docker/dev/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        - prometheus_bloggyspace_dev_data:/prometheus
    command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
        - '--web.enable-lifecycle'
    expose:
        - 9090
    networks:
        - monitoring_dev_nw
        - bloggyspace_nw

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    expose:
      - 9100
    networks:
      - bloggyspace_nw

  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro 
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped
    expose:
      - 8080
    networks:
      - bloggyspace_nw

  
  portainer:
    image: portainer/portainer:latest
    container_name: portainer_bloggyspace
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_bloggyspace_dev_data:/data
    expose:
      - 9000
    networks:
      - monitoring_dev_nw
      - bloggyspace_nw


  grafana:
    image: grafana/grafana:12.4.0
    container_name: grafana
    volumes:
    - grafana_bloggyspace_dev_data:/var/lib/grafana
    - ../../docker/dev/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    env_file:
      - ../../backend/.envs/.env.dev
    environment:
    - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    expose:
    - 3000
    networks:
        - bloggyspace_nw
    depends_on:
      - prometheus
      - node-exporter
      - cadvisor


networks:
  bloggyspace_nw:
    external: true
  monitoring_dev_nw:
    external: true
      
volumes:
  prometheus_bloggyspace_dev_data:
  grafana_bloggyspace_dev_data:
  portainer_bloggyspace_dev_data: