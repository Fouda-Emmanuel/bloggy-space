upstream backend {
    server backend:8000;
}

log_format detailed_log '$remote_addr - $remote_user - [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        '$request_time $upstream_response_time '
                        '"$http_x_forwarded_for" '; 

server {
    listen 80;

    client_max_body_size 20M;

    error_log /var/log/nginx/error.log error;

    proxy_set_header  Host               $host;
    proxy_set_header  X-Real-IP          $remote_addr;
    proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto  $scheme;


    location / {
        root /usr/share/nginx/html;
        index index.html;
        
        try_files $uri $uri/ /index.html;

    }

    location /api/v1/ {
        proxy_pass http://backend;
        proxy_redirect off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        access_log /var/log/backend_access.log detailed_log;
        error_log /var/log/backend_error.log error;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_redirect off;

        access_log /var/log/nginx/admin_access.log detailed_log;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;

        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;

        add_header Cache-Control "public, max-age=604800";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

}