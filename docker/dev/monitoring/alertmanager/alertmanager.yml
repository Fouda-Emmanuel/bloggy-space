global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_WEBHOOK_URL}" # DEV only (requires envsubst or injection)

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'slack-notifications'

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - channel: '#bloggyspace'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}⚠️ ALERT{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Status:* {{ .Status }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}